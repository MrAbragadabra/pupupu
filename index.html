<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#080811" />
		<title>MrAbragadabra</title>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				min-height: 100%;
			}

			body {
				min-height: 100vh;
				min-height: 100svh;
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: hidden;
				background: #080811;
				font-family: Inter, Arial, sans-serif;
			}

			/* Animated background */

			.background {
				position: fixed;
				inset: 0;
				overflow: hidden;
				background: #080811;
				isolation: isolate;
			}

			.glow {
				position: absolute;
				width: 75vmax;
				height: 75vmax;
				border-radius: 50%;
				filter: blur(110px);
				mix-blend-mode: screen;
				will-change: transform;
			}

			.glow-1 {
				top: -35vmax;
				left: -25vmax;
				background: radial-gradient(
					circle,
					#8b5cf6 0%,
					#6738b8 30%,
					transparent 70%
				);
				opacity: 0.65;
				animation: move1 16s ease-in-out infinite alternate;
			}

			.glow-2 {
				bottom: -42vmax;
				right: -28vmax;
				background: radial-gradient(
					circle,
					#06b6d4 0%,
					#2563eb 30%,
					transparent 70%
				);
				opacity: 0.65;
				animation: move2 19s ease-in-out infinite alternate;
			}

			.glow-3 {
				top: 15%;
				left: 24%;
				width: 60vmax;
				height: 60vmax;
				background: radial-gradient(
					circle,
					#ec4899 0%,
					#a855f7 30%,
					transparent 70%
				);
				opacity: 0.4;
				animation: move3 23s ease-in-out infinite alternate;
			}

			/* Background animations */

			@keyframes move1 {
				0% {
					transform: translate(0, 0) scale(0.9);
				}
				100% {
					transform: translate(42vw, 38vh) scale(1.2);
				}
			}

			@keyframes move2 {
				0% {
					transform: translate(0, 0) scale(1.1);
				}
				100% {
					transform: translate(-44vw, -35vh) scale(0.9);
				}
			}

			@keyframes move3 {
				0% {
					transform: translate(-10vw, 8vh) scale(0.9);
				}
				100% {
					transform: translate(18vw, -14vh) scale(1.2);
				}
			}

			/* Dark edges */

			.shade {
				position: absolute;
				inset: 0;
				background: radial-gradient(
					ellipse at center,
					transparent 10%,
					rgba(5, 5, 14, 0.25) 70%,
					rgba(5, 5, 14, 0.6)
				);
			}

			/* Main title */

			main {
				position: relative;
				z-index: 2;
				width: 100%;
				padding: 24px;
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: visible;
			}

			h1 {
				width: 100%;
				max-width: 100%;
				text-align: center;

				font-size: clamp(2rem, 9.2vw, 8.5rem);
				font-weight: 800;
				letter-spacing: -0.075em;
				line-height: 1.3;
				padding-bottom: 0.12em;

				overflow-wrap: anywhere;
				color: transparent;

				background: linear-gradient(
					100deg,
					#ffffff,
					#d8c7ff,
					#a5b4fc,
					#f0abfc,
					#ffffff
				);

				background-size: 250% 100%;
				background-clip: text;
				-webkit-background-clip: text;

				filter: drop-shadow(0 0 28px rgba(167, 139, 250, 0.3));

				animation: textFlow 8s ease-in-out infinite alternate;
			}

			@keyframes textFlow {
				from {
					background-position: 0% 50%;
				}
				to {
					background-position: 100% 50%;
				}
			}

			/* Mobile */

			@media (max-width: 600px) {
				main {
					padding: 20px;
				}

				h1 {
					font-size: clamp(2rem, 11vw, 4rem);
					letter-spacing: -0.065em;
				}

				.glow {
					opacity: 0.5;
					filter: blur(75px);
				}
			}

			/* Reduced motion accessibility */

			@media (prefers-reduced-motion: reduce) {
				.glow,
				h1 {
					animation: none;
				}
			}
		</style>
	</head>

	<body>
		<div class="background">
			<div class="glow glow-1"></div>
			<div class="glow glow-2"></div>
			<div class="glow glow-3"></div>
			<div class="shade"></div>
		</div>

		<main>
			<h1>MrAbragadabra</h1>
		</main>
	</body>
</html>
